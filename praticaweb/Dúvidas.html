 <form class="contato-form" id="form-duvidas">
    <label for="nome">Nome completo</label>
    <input type="text" id="nome" placeholder="Ex: Leonardo Ishikawa" required>
    
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" placeholder="exemplo@e-mail.com" required>
    
    
    <label for="mensagem">Sua mensagem</label>
    <textarea id="mensagem" placeholder="Como podemos ajudar?" rows="15" required></textarea>


    <button type="submit">Enviar</button>
  </form>
